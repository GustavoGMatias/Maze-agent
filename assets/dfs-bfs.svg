<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420"><rect width="1200" height="420" rx="22" fill="#0a0f1c"/><text x="60" y="62" fill="#f1f5fb" font-family="Arial,sans-serif" font-size="28" font-weight="700">ONE AGENT · TWO MEMORY STRUCTURES</text><text x="60" y="94" fill="#9fb0ca" font-family="Arial,sans-serif" font-size="16">The search loop stays the same. The next room depends on the structure.</text><rect x="60" y="145" width="300" height="205" rx="16" fill="#14223a" stroke="#3b5277"/><text x="88" y="184" fill="#f1f5fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">DFS · STACK</text><text x="88" y="214" fill="#9fb0ca" font-family="Arial,sans-serif" font-size="15">Last in, first out</text><g fill="#45a0ff"><rect x="100" y="252" width="72" height="26" rx="5"/><rect x="100" y="283" width="72" height="26" rx="5"/><rect x="100" y="314" width="72" height="26" rx="5"/></g><path d="M188 326V260" stroke="#ffc652" stroke-width="4" stroke-linecap="round"/><path d="M178 270l10-12 10 12" fill="none" stroke="#ffc652" stroke-width="4"/><text x="220" y="273" fill="#dce7f5" font-family="Arial,sans-serif" font-size="15">Explore deep</text><text x="220" y="296" fill="#dce7f5" font-family="Arial,sans-serif" font-size="15">then backtrack</text><rect x="450" y="145" width="300" height="205" rx="16" fill="#14223a" stroke="#3b5277"/><text x="478" y="184" fill="#f1f5fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">BFS · QUEUE</text><text x="478" y="214" fill="#9fb0ca" font-family="Arial,sans-serif" font-size="15">First in, first out</text><g fill="#31d69b"><rect x="490" y="275" width="58" height="34" rx="5"/><rect x="555" y="275" width="58" height="34" rx="5"/><rect x="620" y="275" width="58" height="34" rx="5"/></g><path d="M688 292h34" stroke="#ffc652" stroke-width="4" stroke-linecap="round"/><path d="M711 282l12 10-12 10" fill="none" stroke="#ffc652" stroke-width="4"/><text x="490" y="253" fill="#dce7f5" font-family="Arial,sans-serif" font-size="15">Explore in waves</text><rect x="840" y="145" width="300" height="205" rx="16" fill="#14223a" stroke="#3b5277"/><text x="868" y="184" fill="#f1f5fb" font-family="Arial,sans-serif" font-size="22" font-weight="700">SAME AGENT</text><text x="868" y="214" fill="#9fb0ca" font-family="Arial,sans-serif" font-size="15">Observe → decide → move</text><circle cx="910" cy="282" r="18" fill="#31d69b"/><path d="M928 282h48m-12-10 12 10-12 10" stroke="#ffc652" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1000" cy="282" r="18" fill="#ff5e69"/><text x="868" y="326" fill="#dce7f5" font-family="Arial,sans-serif" font-size="14">Visited set + parent map</text><path d="M360 245h90m-12-10 12 10-12 10M750 245h90m-12-10 12 10-12 10" stroke="#6f89b2" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>